name: Adult final official source extraction
on:
  push:
    branches: [qa/adult-final-source]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Download official 2026 Ek-2 PDF
        run: |
          set -e
          URL="https://dosyamerkez.saglik.gov.tr/Eklenti/55773/0/ek-2-hastane-oncesi-acil-tibbi-yardim-ve-bakim-akis-semalaripdf.pdf"
          curl -fL --retry 3 --retry-delay 2 -A "Mozilla/5.0" "$URL" -o ek2.pdf
          pdfinfo ek2.pdf | head -30
      - name: Extract Y01 and Y39-Y41 ranges
        run: |
          mkdir -p extracts renders
          for p in $(seq 2 8) $(seq 68 80); do
            pdftotext -layout -f "$p" -l "$p" ek2.pdf "extracts/pdf-$p.txt" || true
            pdftoppm -f "$p" -l "$p" -png -r 180 -singlefile ek2.pdf "renders/pdf-page-$p" >/dev/null 2>&1 || true
          done
      - name: Upload source audit
        uses: actions/upload-artifact@v4
        with:
          name: adult-final-official-source
          path: |
            extracts/
            renders/
