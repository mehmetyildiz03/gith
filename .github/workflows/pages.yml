name: Validate and deploy Saha112

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Runtime info
        run: node --version
      - name: Build PWA icons
        run: python3 scripts/build_icons.py
      - name: JavaScript syntax
        run: |
          node --check cases-data.js
          node --check app-core.js
          node --check sw.js
      - name: Clinical content and PWA QA
        run: node scripts/validate.mjs
      - name: UI contrast and hierarchy audit
        run: node scripts/ui-audit.mjs

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build PWA icons
        run: python3 scripts/build_icons.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
